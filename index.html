<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Add Jeramy Hope to Contacts</title>
  <meta name="description" content="Add Jeramy Hope to your contacts.">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #172033;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 28px;
    }
    main { width: min(100%, 440px); text-align: center; }
    h1 { font-size: 34px; line-height: 1.08; margin: 0 0 10px; }
    .role { margin: 0 0 34px; color: #526072; line-height: 1.45; }
    .button {
      display: block;
      width: 100%;
      padding: 17px 20px;
      border: 0;
      border-radius: 14px;
      background: #172033;
      color: #fff;
      text-decoration: none;
      font: inherit;
      font-weight: 650;
      font-size: 18px;
      cursor: pointer;
    }
    .help { margin: 16px 0 0; color: #687587; font-size: 13px; line-height: 1.5; }
    .details { margin-top: 28px; color: #687587; font-size: 14px; line-height: 1.7; }
    .details a { color: inherit; }
  </style>
</head>
<body>
<main>
  <h1>Jeramy Hope</h1>
  <p class="role">Executive Leader · Board Director · Systems Reform Advocate</p>
  <a class="button" id="save-contact" href="Jeramy_Hope.vcf" download="Jeramy_Hope.vcf">Add Jeramy to Contacts</a>
  <p class="help">Viewing this in LinkedIn? If the contact does not open, tap ••• and choose Open in Safari.</p>
  <div class="details">
    <div>0418 983 681</div>
    <div><a href="mailto:jeramyhope@gmail.com">jeramyhope@gmail.com</a></div>
    <div><a href="https://jeramyhope.com/">jeramyhope.com</a></div>
  </div>
</main>
<script>
  const contactButton = document.getElementById("save-contact");

  contactButton.addEventListener("click", async (event) => {
    event.preventDefault();

    try {
      const response = await fetch("Jeramy_Hope.vcf", { cache: "no-store" });
      if (!response.ok) throw new Error("Contact file unavailable");

      const vcard = await response.text();
      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const download = document.createElement("a");

      download.href = url;
      download.download = "Jeramy_Hope.vcf";
      document.body.appendChild(download);
      download.click();
      download.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch {
      window.location.href = "Jeramy_Hope.vcf";
    }
  });
</script>
</body>
</html>
